<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Management</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link th:href="@{/assets/css/admin/order_management.css}"
	rel="stylesheet" />
<link th:href="@{/assets/css/admin/admin_home.css}" rel="stylesheet" />
</head>
<body>
	<div th:insert="admin/menu :: menuAdminShop"></div>
	<div class="main-content">
		<div th:insert="admin/header :: headerAdminShop"></div>
		<div class="card-admin card">
			<div class="card-body">
				<div class="row mb-4">
					<form id="searchForm" method="GET" th:object="${searchOrder}"
						th:action="@{/admin/order-management}"
						class="border rounded p-4 shadow-sm bg-light">
						<div class="row mb-3">
							<div class="col">
								<label for="stockQuantity" class="form-label">Mã đơn
									hàng </label> <input type="text" class="form-control" th:field="*{id}">
							</div>
							<div class="col">
								<label for="stockQuantity" class="form-label">Tên khách
									hàng </label> <input type="text" class="form-control"
									th:field="*{name}">
							</div>
						</div>
						<div class="row mb-3">
							<div class="col">
								<label for="category" class="form-label">Trạng thái</label> <select
									class="form-select" th:field="*{status}">
									<option value="">Trạng thái</option>
									<option value="DA_GIAO">Đã giao</option>
									<option value="CHO_XAC_NHAN">Chờ xác nhận</option>
									<option value="DANG_GIAO">Đang giao</option>
								</select>
							</div>
							<div class="col"></div>
							<div class="col"></div>
							<div class="col"></div>
						</div>

						<!-- Nút tìm kiếm -->
						<button type="submit" class="btn btn-primary">
							<i class="fas fa-search"></i> Tìm kiếm
						</button>
					</form>
					<div
						class="card-header bg-white d-flex justify-content-between align-items-center">
						<h5 class="mb-0"></h5>
						<div class="d-flex justify-content-start gap-2 mb-3">
							<button class="btn btn-danger btn-sm" id="btnDeleteOrders">
								<i class="fas fa-trash-alt me-1"></i>
							</button>
						</div>

					</div>

				</div>

				<h1>Danh sách đơn hàng</h1>
				<div class="table-responsive">
					<table class="table table-hover">
						<thead class="table-light">
							<tr>
								<th><input type="checkbox" id="checkAll" /></th>
								<th>Mã đơn hàng</th>
								<th>Khách hàng</th>
								<th>Ngày đặt</th>
								<th>Tổng tiền</th>
								<th>Trạng thái</th>
								<th>Hành động</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="item : ${orders.result}">
								<td><input type="checkbox" class="order-checkbox"
									th:value="${item.id}" /></td>
								<td>#ORD<span th:text="${item.id}"></span></td>
								<td th:text="${item.recipentName}">Lê Văn C</td>
								<td th:text="${item.createdDate}">2025-11-15</td>
								<td th:text="${item.totalAmount}"></td>
								<td>
									<button class="btnChangeStatus" th:data-id="${item.id}">
										<span class="status-icon" th:text="${item.orderStatus}"></span>
									</button>
								</td>
								<td>
									<a th:href="@{/admin/order-detail-{id}(id=${item.id})}"><button class="btn-detail">Chi tiết</button></a>
									<a>
										<button class="btn-delete"
											th:onclick="'modalDeleteOrder(' + ${item.id} + ')'">
											<i class="fas fa-trash"></i>
										</button>
								    </a>
								</td>
							</tr>
						</tbody>
					</table>
					<input type="hidden" id="orderId" name="orderId" />
				</div>
			</div>
			
			<!-- Paging -->
			<form th:action="@{/admin/order-management}" method="get"
				class="pagination-form">
				<button class="page-btn prev" type="submit" name="page">&laquo;</button>

				<div class="pagination-numbers">
					<span
						th:each="num : ${#numbers.sequence(1, orders.totalPage)}">
						<button type="submit" name="page" th:text="${num}"
							th:value="${num}" class="page-btn"></button>
					</span>
				</div>

				<button class="page-btn next" type="submit" name="page">&raquo;</button>
			</form>
		</div>

	</div>

	<!-- Delete Confirmation Modal -->
	<div class="modal fade" id="deleteModal" tabindex="-1"
		aria-labelledby="deleteModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title" id="deleteModalLabel">Xác nhận xóa</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="Close"></button>
					<input type="hidden" id="orderId" name="orderId" />
				</div>
				<div class="modal-body">Bạn có chắc chắn muốn xóa đơn hàng
					này? Hành động này không thể hoàn tác!</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">Hủy</button>
					<button type="button" class="btn btn-danger" id="btnDeleteOrder">Xóa</button>
				</div>
			</div>
		</div>
	</div>

	<!-- jQuery -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

	<script>
	
	function modalDeleteOrder(orderId) {
		const modalElement = document.getElementById('deleteModal');
		const deleteModal = new bootstrap.Modal(modalElement);
		document.getElementById('orderId').value = orderId;
		deleteModal.show();
	}
    //xóa từng đơn hàng
    function deleteOrder(orderId) {
    	$.ajax({
    		type: 'DELETE',
    		url: "/admin/delete-order/" + orderId,
    		data: JSON.stringify(orderId),
    		success: function(res) {
    			alert("xóa thành công");
    			location.reload();
    		},
    		error: function(res) {
    			alert("xóa không thành công");
    		}
    	});
    }
    
    $('#btnDeleteOrder').click(function(e){
    	e.preventDefault();
    	var orderId = $('#orderId').val();
    	deleteOrder(orderId);
    })
    //1 cho tất cả
	$('#checkAll').on('change', function() {
		$('.order-checkbox').prop('checked', this.checked);
	});
    
    //xóa nhiều sản phẩm cùng lúc
    $('#btnDeleteOrders').click(function(e){
    	e.preventDefault();
    	var ids = [];
    	$('.order-checkbox:checked').each(function () {
            ids.push($(this).val());
        });
    	deleteOrders(ids);
    })
    
    function deleteOrders(ids){
    	const queryString = ids.map(id => `ids=${id}`).join('&');
    	$.ajax({
    		type: 'DELETE',
    		url: "/admin/delete-order/" + ids,
    		data: JSON.stringify(ids),
    		success: function(res) {
    			alert("xóa thành công");
    			location.reload();
    		},
    		error: function(res) {
    			alert("xóa không thành công");
    		}
    	});
    }
    
    $(document).on('click', '.btnChangeStatus', function (e) {
        e.preventDefault();
        
        var id = $(this).data("id");

        $.ajax({
            type: 'POST',
            url: "/admin/change-status",
            contentType: "application/json",
            data: JSON.stringify(id),
            success: function(res) {
                location.reload();
            },
            error: function(res) {
                alert("Lỗi hệ thống");
            }
        });
    });
	</script>
</body>
</html>
